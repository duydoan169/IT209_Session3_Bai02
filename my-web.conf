server {
    listen 80;
    listen [::]:80;

    server_name _;
    root /var/www/my-web/html;
    index index.html;

    # Cấu hình trang báo lỗi 404 tùy chỉnh
    error_page 404 /404.html;

    # Bảo mật tệp 404.html bằng chỉ thị internal
    location = /404.html {
        root /var/www/my-web/html;
        internal;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
